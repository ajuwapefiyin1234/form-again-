<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6b6b, #7f5af0);
    margin: 0;
    color: white;
    text-align: center;
  }

  .welcome-box {
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    max-width: 450px;
    width: 90%;
    overflow-wrap: break-word;   /* break long words */
    word-wrap: break-word;       /* legacy support */
    word-break: break-word;      /* break super long text */
    white-space: pre-wrap;       /* preserve newlines */
    max-height: 80vh;            /* prevent huge boxes */
    overflow-y: auto;            /* scroll if content is too tall */
  }

  h2 { 
    color: #7f5af0; 
    margin-bottom: 20px; 
  }

  p { 
    margin: 8px 0; 
    font-size: 18px; 
    text-align: left; 
    white-space: pre-wrap;       /* preserve line breaks */
    word-wrap: break-word; 
    overflow-wrap: break-word;
  }
</style>
</head>
<body>

<div class="welcome-box">
  <h2 id="welcomeTitle">Welcome!</h2>

  <p id="nameText"></p>
  <p id="ageText"></p>
  <p id="addressText"></p>
  <p id="emailText"></p>
  <p id="contributionText"></p>
</div>

<script>
  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      name: params.get("name") || '',
      age: params.get("age") || '',
      address: params.get("address") || '',
      email: params.get("email") || '',
      contribution: params.get("contribution") || ''
    };
  }

  const params = getQueryParams();

  document.getElementById("nameText").textContent = `Name: ${params.name}`;
  document.getElementById("ageText").textContent = `Age: ${params.age}`;
  document.getElementById("addressText").textContent = `Address: ${params.address}`;
  document.getElementById("emailText").textContent = `Email: ${params.email}`;
  document.getElementById("contributionText").textContent = `Contribution: ${params.contribution}`;
</script>

</body>
</html>
