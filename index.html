<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Us Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 { text-align: center; margin-bottom: 20px; }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
    }

    button {
      background: #7f5af0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    textarea { resize: vertical; min-height: 80px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Join Us</h1>
    <form id="form">
      <input id="name" type="text" placeholder="Name" required />
      <input id="age" type="number" placeholder="Age" required min="1" />
      <input id="address" type="text" placeholder="Address" required />
      <input id="email" type="email" placeholder="Email" required />
      <textarea id="contribution" placeholder="What can you contribute?" required></textarea>
      <button id="submitBtn" type="submit">Submit</button>
    </form>
  </div>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (submitBtn.disabled) return;   // prevent double submit
    submitBtn.disabled = true;

    const email = document.getElementById('email').value.trim();

    if (!form.checkValidity()) {
      form.reportValidity();
      submitBtn.disabled = false;
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if (!emailRegex.test(email)) {
      alert("Please enter a valid email (e.g., test@gmail.com)");
      submitBtn.disabled = false;
      return;
    }

    setTimeout(() => {
      const params = new URLSearchParams({
        name: document.getElementById('name').value.trim(),
        age: document.getElementById('age').value.trim(),
        address: document.getElementById('address').value.trim(),
        email,
        contribution: document.getElementById('contribution').value.trim(),
      });
      window.location.href = 'welcome.html?' + params.toString();
    }, 150);
  });
});

// 🔹 Reset form when navigating back from welcome page
window.addEventListener('pageshow', (event) => {
  if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
    document.getElementById('form').reset();
  }
});
  </script>

</body>
</html>
